services:
  mysql:
    image: mysql:8.4
    container_name: meu_mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"

  redis:
    image: redis:7.4-alpine
    container_name: meu_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq_sample
    ports:
      - "5672:5672"
      - "15672:15672"